<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8"/>
    <title>Мій профіль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-4">

    ```
    <!-- Інформація про користувача -->
    <div class="card mb-4">
        <div class="card-header">
            <h4>Information about user</h4>
        </div>
        <div class="card-body">
            <p><strong>Username:</strong> <span th:text="${user.username}"></span></p>
            <p><strong>Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong>Balance:</strong> <span th:text="${user.balance}"></span> ₴</p>
        </div>
    </div>

    <!-- Список турів -->
    <div class="card">
        <div class="card-header">
            <h4>My tours</h4>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Price</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tour : ${userTours}">
                    <td th:text="${tour.title}"></td>
                    <td th:text="${tour.description}"></td>
                    <td th:text="${tour.price}"></td>
                    <td th:text="${tour.status}"></td>
                    <td>
                        <form th:action="@{/booking/cancel/{id}(id=${tour.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">Cancel Booking</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    ```

</div>
</body>
</html>
