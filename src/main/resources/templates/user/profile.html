<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{profile.title}">Мій профіль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-4">

    <!-- Інформація про користувача -->
    <div class="card mb-4">
        <div class="card-header">
            <h4 th:text="#{profile.info.title}">Information about user</h4>
        </div>
        <div class="card-body">
            <p><strong th:text="#{profile.username}">Username:</strong> <span th:text="${user.username}"></span></p>
            <p><strong th:text="#{profile.email}">Email:</strong> <span th:text="${user.email}"></span></p>
            <p><strong th:text="#{profile.balance}">Balance:</strong> <span th:text="${user.balance}"></span> ₴</p>
        </div>
    </div>

    <!-- Кнопка повернення на Dashboard -->
    <div style="margin-bottom: 15px;">
        <a th:href="@{/dashboard}" class="btn btn-secondary" th:text="#{profile.back}">Back to Dashboard</a>
    </div>

    <!-- Список турів -->
    <div class="card">
        <div class="card-header">
            <h4 th:text="#{profile.tours.title}">My tours</h4>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th th:text="#{profile.tours.name}">Name</th>
                    <th th:text="#{profile.tours.description}">Description</th>
                    <th th:text="#{profile.tours.price}">Price</th>
                    <th th:text="#{profile.tours.status}">Status</th>
                    <th th:text="#{profile.tours.action}">Action</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tour : ${userTours}">
                    <td th:text="${tour.title}"></td>
                    <td th:text="${tour.description}"></td>
                    <td th:text="${tour.price}"></td>
                    <td th:text="${tour.status}"></td>
                    <td>
                        <form th:action="@{/booking/cancel/{id}(id=${tour.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm" th:text="#{profile.tours.cancel}">Cancel Booking</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
