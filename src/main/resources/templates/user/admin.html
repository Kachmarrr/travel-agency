<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{admin.title}">Admin — Users</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        .users-table { width:100%; border-collapse:collapse; }
        .users-table th, .users-table td { padding:12px 10px; text-align:left; border-bottom:1px solid #f1f1f1; vertical-align:middle; }
        .users-table th { color:#2c3e50; font-weight:600; }
        .role-badge { padding:6px 10px; border-radius:10px; font-size:0.85rem; font-weight:600; display:inline-block; }
        .role-admin { background:#ffeedd; color:#b54b00; }
        .role-manager { background:#e8f6ef; color:#0f9d71; }
        .role-user { background:#eef6ff; color:#1e6fbf; }
        .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
        .flash { margin-bottom:12px; }
        @media (max-width:820px) { .users-grid { overflow-x:auto; } }
    </style>
</head>
<body>

<!-- NAVBAR -->
<div class="navbar">
    <div class="navbar-container container">
        <div class="navbar-left">
            <a class="navbar-brand" th:href="@{/}">Travel Agency</a>
            <div class="navbar-links">
                <a th:href="@{/}" th:text="#{nav.home}">Home</a>
            </div>
        </div>
        <div class="navbar-right">
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-logout" th:text="#{nav.logout}">Log out</button>
            </form>
        </div>
    </div>
</div>

<div class="container">
    <div class="create-card">

        <!-- Flash / error messages: використовуємо model attributes, а не #fields -->
        <div class="flash">
            <div th:if="${success}" class="alert alert--success" th:text="${success}"></div>

            <div th:if="${error}" class="alert alert--danger" th:text="${error}"></div>

            <!-- Якщо контролер додає list/array під ключем 'errors' -->
            <div th:if="${errors != null}">
                <div class="alert alert--danger">
                    <ul>
                        <li th:each="e : ${errors}" th:text="${e}">Error message</li>
                    </ul>
                </div>
            </div>
        </div>

        <h1 th:text="#{users.list.title}">Users</h1>

        <!-- Локалізовані шаблони повідомлень (в data-атрибутах) -->
        <div id="i18n"
             th:data-make-msg="#{confirm.makeManager}"
             th:data-remove-msg="#{confirm.removeManager}"
             style="display:none"></div>

        <div th:if="${#lists.isEmpty(users)}" class="no-access" th:text="#{users.noUsers}">
            No users found
        </div>

        <div class="users-grid" th:if="${!#lists.isEmpty(users)}">
            <table class="users-table card">
                <thead>
                <tr>
                    <th th:text="#{users.table.username}">Username</th>
                    <th th:text="#{users.table.email}">Email</th>
                    <th th:text="#{users.table.balance}">Balance</th>
                    <th th:text="#{users.table.tours}">Tours</th>
                    <th th:text="#{users.table.role}">Role</th>
                    <th th:text="#{users.table.actions}">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}" class="user-row">
                    <td>
                        <div class="card-title" th:text="${user.username}">username</div>
                        <div class="form-hint" th:text="'#' + ${user.id}">#id</div>
                    </td>

                    <td>
                        <div th:text="${user.email}">email@example.com</div>
                    </td>

                    <td>
                        <div th:text="${user.balance}">0.0</div>
                    </td>

                    <td>
                        <div th:text="${user.tours != null ? user.tours.size() : 0}">0</div>
                    </td>

                    <td>
              <span th:switch="${user.role != null ? user.role.name() : 'USER'}">
                <span th:case="'ADMIN'" class="role-badge role-admin" th:text="#{role.ADMIN}">ADMIN</span>
                <span th:case="'MANAGER'" class="role-badge role-manager" th:text="#{role.MANAGER}">MANAGER</span>
                <span th:case="*" class="role-badge role-user" th:text="#{role.USER}">USER</span>
              </span>
                    </td>

                    <td>
                        <div class="actions">
                            <!-- Make manager -->
                            <form th:if="${user.role == null or user.role.name() != 'MANAGER'}"
                                  th:action="@{/users/{id}/make-manager(id=${user.id})}"
                                  method="post"
                                  th:attr="data-username=${user.username}"
                                  onsubmit="return confirmMake(this)">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-outline-primary" th:text="#{users.button.makeManager}">Make manager</button>
                            </form>

                            <!-- Remove manager -->
                            <form th:if="${user.role != null and user.role.name() == 'MANAGER'}"
                                  th:action="@{/users/{id}/remove-manager(id=${user.id})}"
                                  method="post"
                                  th:attr="data-username=${user.username}"
                                  onsubmit="return confirmRemove(this)">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <button type="submit" class="btn btn-outline-secondary" th:text="#{users.button.removeManager}">Remove</button>
                            </form>

                            <a th:href="@{/users/profile/{id}(id=${user.id})}" class="link" th:text="#{users.button.view}">View</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="card-footer">
            <small th:text="#{admin.footer}">Admin panel</small>
        </div>
    </div>
</div>

<script>
    (function(){
        const i18n = document.getElementById('i18n');
        const makeTemplate = i18n ? (i18n.dataset.makeMsg || 'Are you sure to make {0} manager?') : 'Are you sure?';
        const removeTemplate = i18n ? (i18n.dataset.removeMsg || 'Are you sure to remove manager role from {0}?') : 'Are you sure?';

        function safeName(name) {
            if (!name) return '';
            return String(name).replace(/[\n\r<>"]/g, '').trim();
        }

        function fillTemplate(tpl, username) {
            return tpl.replace('{0}', safeName(username));
        }

        window.confirmMake = function(form) {
            const username = form.dataset.username || (form.closest('tr') && form.closest('tr').querySelector('.card-title')?.innerText) || '';
            return confirm(fillTemplate(makeTemplate, username));
        };

        window.confirmRemove = function(form) {
            const username = form.dataset.username || (form.closest('tr') && form.closest('tr').querySelector('.card-title')?.innerText) || '';
            return confirm(fillTemplate(removeTemplate, username));
        };
    })();
</script>

</body>
</html>
