<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title th:text="#{login.title}">Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<section>
    <div class="page">
        <div class="login-wrapper">
            <div class="brand">
                <img src="/images/logo.png" alt="logo" class="brand__logo" onerror="this.style.display='none'">
                <h1 class="brand__title" th:text="#{login.brand.title}">Welcome back</h1>
                <p class="brand__subtitle" th:text="#{login.brand.subtitle}">Sign in to continue to your account</p>
            </div>

            <div class="card">
                <div th:if="${param.error}" class="alert alert--danger" th:text="#{login.error}">Invalid username or password.</div>
                <div th:if="${param.logout}" class="alert alert--success" th:text="#{login.logout}">You have been logged out.</div>

                <form class="form" method="post" th:action="@{/auth/login}">
                    <div class="form-row">
                        <label class="form-label" for="username" th:text="#{login.username}">Username</label>
                        <input id="username" name="username" type="text" class="form-input" th:placeholder="#{login.username}" required>
                    </div>

                    <div class="form-row">
                        <label class="form-label" for="password" th:text="#{login.password}">Password</label>
                        <input id="password" name="password" type="password" class="form-input" th:placeholder="#{login.password}" required>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/auth/register}" class="link" th:text="#{login.register.link}">Don't have an account? Register</a>
                        <button type="submit" class="btn" th:text="#{login.submit}">Login</button>
                    </div>
                </form>

                <div class="card-footer">
                    <a href="#" class="text-small" th:text="#{login.forgot.password}">Forgot password?</a>
                </div>
            </div>
        </div>
    </div>
</section>
</html>
