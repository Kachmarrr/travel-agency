<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="uk">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${tour.title} + ' — ' + #{tour.details}">Tour Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="container">

    <div class="create-card" style="margin-top: 1.5rem;">

        <!-- Flash повідомлення -->
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Заголовок -->
        <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
            <h1 class="card-title" th:text="${tour.title}">Tour Title</h1>

            <!-- Вартість -->
            <div style="margin-left:auto; text-align:right;">
                <div style="font-size:0.95rem; color:#6c757d;" th:text="#{tour.price}">Price</div>
                <div class="tour-price" th:text="${tour.price != null ? tour.price + ' ₴' : '—'}">0 ₴</div>
            </div>
        </div>

        <p class="card-text" style="margin-top:10px;" th:text="${tour.description}">Tour description</p>

        <!-- Деталі списком -->
        <div style="margin-top:16px; display:block;">
            <div class="list-group-item">
                <strong th:text="#{tour.type}">Tour type:</strong>
                <span th:text="${tour.tourType != null ? tour.tourType : '—'}">—</span>
            </div>
            <div class="list-group-item">
                <strong th:text="#{tour.hotel}">Hotel:</strong>
                <span th:text="${tour.hotelType != null ? tour.hotelType : '—'}">—</span>
            </div>
            <div class="list-group-item">
                <strong th:text="#{tour.transfer}">Transfer type:</strong>
                <span th:text="${tour.transferType != null ? tour.transferType : '—'}">—</span>
            </div>
            <div class="list-group-item">
                <strong th:text="#{tour.status}">Tour status:</strong>
                <span th:text="${tour.status != null ? tour.status : '—'}">—</span>
            </div>
            <div class="list-group-item">
                <strong th:text="#{tour.arrival}">Arrival date:</strong>
                <span th:text="${tour.arrivalDate != null ? tour.arrivalDate : '—'}">—</span>
            </div>
            <div class="list-group-item">
                <strong th:text="#{tour.eviction}">Evocation date:</strong>
                <span th:text="${tour.evictionDate != null ? tour.evictionDate : '—'}">—</span>
            </div>
            <div class="list-group-item">
                <strong th:text="#{tour.hot}">Hot tour:</strong>
                <span th:text="${tour.isHot}">false</span>
            </div>

            <!-- Інформація про користувача (видно лише менеджеру) -->
            <div class="list-group-item" sec:authorize="hasRole('MANAGER')">
                <strong th:text="#{tour.bookedBy}">Booked by:</strong>
                <span th:text="${user != null ? user.getUsername + ' (' + user.getEmail() + ')' : #{tour.notBooked}}">Not booked</span>
            </div>
        </div>

        <!-- Дії: назад, швидке бронювання (POST), форма створення броні -->
        <div class="form-actions" style="margin-top:18px; align-items:center;">
            <a th:href="@{/dashboard}" class="btn btn-secondary" th:text="#{button.back}">Back to tour list</a>

            <!-- Швидке бронювання через POST -->
            <form th:action="@{|/booking/create/${tour.id}|}" method="post" style="display:inline-block;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn-book" th:text="#{button.bookNow}">Book now</button>
            </form>

            <!-- Кнопка скасування бронювання (видно лише менеджеру) -->
            <form th:action="@{|/booking/cancel/${tour.id}|}" method="post" sec:authorize="hasRole('MANAGER')" style="display:inline-block; margin-left:10px;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-danger" th:text="#{button.cancelBooking}">Cancel Booking instead of user</button>
            </form>
        </div>

        <!-- Дрібний футер -->
        <div class="card-footer" style="margin-top:14px;" th:text="#{tour.footer}">
            After booking, you will find your order in your profile — in the “My Booked Tours” section.
        </div>
    </div>

</div>

</body>
</html>
