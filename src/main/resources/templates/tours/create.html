<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="uk">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{tour.create.title}">Create Tour</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>

<nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
        <a class="navbar-brand" th:href="@{/}" th:text="#{app.name}">Travel Agency</a>
        <div class="navbar-right">
            <a th:href="@{/user/profile}" class="btn btn-profile" th:text="#{nav.profile}">Profile</a>
            <a th:href="@{/logout}" class="btn btn-logout" th:text="#{nav.logout}">Log out</a>
        </div>
    </div>
</nav>

<div class="container create-tour" style="max-width:960px; margin:24px auto; padding:0 16px;">
    <h1 th:text="#{tour.create.heading}">Create New Tour</h1>

    <!-- Only managers see the form -->
    <div sec:authorize="hasRole('MANAGER')">

        <div class="card create-card" style="padding:16px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.06);">
            <!-- th:object повинен відповідати імені modelAttribute з контролера (наприклад "tourDTO") -->
            <form th:action="@{/tours/create}" th:object="${tourDTO}" method="post" novalidate>

                <!-- CSRF token -->
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Глобальний блок помилок -->
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert" style="margin-bottom:16px;">
                    <p th:text="#{form.validation.errors}">Будь ласка, виправте помилки в формі.</p>
                </div>

                <div class="form-grid" style="display:grid; grid-template-columns: repeat(2, 1fr); gap:16px;">

                    <!-- Title -->
                    <div class="form-group">
                        <label for="title" th:text="#{form.label.title}">Title</label>
                        <input class="form-input"
                               type="text"
                               id="title"
                               th:field="*{title}"
                               th:placeholder="#{form.placeholder.title}"
                               required
                               aria-required="true"
                               aria-invalid="${#fields.hasErrors('title')}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                    </div>

                    <!-- Price -->
                    <div class="form-group">
                        <label for="price" th:text="#{form.label.price}">Price</label>
                        <input class="form-input"
                               type="number"
                               id="price"
                               th:field="*{price}"
                               min="0"
                               step="0.01"
                               th:placeholder="#{form.placeholder.price}"
                               required
                               aria-required="true"
                               aria-invalid="${#fields.hasErrors('price')}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
                    </div>

                    <!-- Description full width -->
                    <div class="form-group full" style="grid-column: 1 / -1;">
                        <label for="description" th:text="#{form.label.description}">Description</label>
                        <textarea class="form-input"
                                  id="description"
                                  th:field="*{description}"
                                  th:placeholder="#{form.placeholder.description}"
                                  rows="4"
                                  required
                                  aria-required="true"
                                  aria-invalid="${#fields.hasErrors('description')}"></textarea>
                        <div class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                    </div>

                    <!-- TourType -->
                    <div class="form-group">
                        <label for="tourType" th:text="#{form.label.tourType}">Tour Type</label>
                        <select class="form-input" id="tourType" th:field="*{tourType}" required
                                aria-required="true" aria-invalid="${#fields.hasErrors('tourType')}">
                            <option value="" th:text="#{form.select.default}">-- Select tour type --</option>
                            <option th:each="t : ${T(com.epam.finaltask.model.enums.TourType).values()}"
                                    th:value="${t.name()}"
                                    th:text="${t.name()}">
                            </option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('tourType')}" th:errors="*{tourType}"></div>
                    </div>

                    <!-- TransferType -->
                    <div class="form-group">
                        <label for="transferType" th:text="#{form.label.transferType}">Transfer Type</label>
                        <select class="form-input" id="transferType" th:field="*{transferType}" required
                                aria-required="true" aria-invalid="${#fields.hasErrors('transferType')}">
                            <option value="" th:text="#{form.select.default}">-- Select transfer type --</option>
                            <option th:each="tr : ${T(com.epam.finaltask.model.enums.TransferType).values()}"
                                    th:value="${tr.name()}"
                                    th:text="${tr.name()}">
                            </option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('transferType')}" th:errors="*{transferType}"></div>
                    </div>

                    <!-- HotelType -->
                    <div class="form-group">
                        <label for="hotelType" th:text="#{form.label.hotelType}">Hotel Type</label>
                        <select class="form-input" id="hotelType" th:field="*{hotelType}" required
                                aria-required="true" aria-invalid="${#fields.hasErrors('hotelType')}">
                            <option value="" th:text="#{form.select.default}">-- Select hotel type --</option>
                            <option th:each="h : ${T(com.epam.finaltask.model.enums.HotelType).values()}"
                                    th:value="${h.name()}"
                                    th:text="${h.name()}">
                            </option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('hotelType')}" th:errors="*{hotelType}"></div>
                    </div>

                    <!-- Status -->
                    <div class="form-group">
                        <label for="status" th:text="#{form.label.status}">Status</label>
                        <select class="form-input" id="status" th:field="*{status}" required
                                aria-required="true" aria-invalid="${#fields.hasErrors('status')}">
                            <option value="" th:text="#{form.select.default}">-- Select status --</option>
                            <option th:each="s : ${T(com.epam.finaltask.model.enums.TourStatus).values()}"
                                    th:value="${s.name()}"
                                    th:text="${s.name()}">
                            </option>
                        </select>
                        <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                    </div>

                    <!-- Arrival Date -->
                    <div class="form-group">
                        <label for="arrivalDate" th:text="#{form.label.arrivalDate}">Arrival Date</label>
                        <input class="form-input" type="date" id="arrivalDate" th:field="*{arrivalDate}" required
                               aria-required="true" aria-invalid="${#fields.hasErrors('arrivalDate')}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('arrivalDate')}" th:errors="*{arrivalDate}"></div>
                    </div>

                    <!-- Eviction Date -->
                    <div class="form-group">
                        <label for="evictionDate" th:text="#{form.label.evictionDate}">Eviction Date</label>
                        <input class="form-input" type="date" id="evictionDate" th:field="*{evictionDate}" required
                               aria-required="true" aria-invalid="${#fields.hasErrors('evictionDate')}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('evictionDate')}" th:errors="*{evictionDate}"></div>
                    </div>

                    <!-- Hot tour checkbox -->
                    <div class="form-group" style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="isHot" th:field="*{isHot}" />
                        <label for="isHot" style="margin:0;" th:text="#{form.label.hotTour}">Hot Tour</label>
                        <div class="field-error" th:if="${#fields.hasErrors('isHot')}" th:errors="*{isHot}"></div>
                    </div>

                    <!-- Hidden userId -->
                    <input type="hidden" th:field="*{userId}" />

                </div> <!-- /.form-grid -->

                <div style="margin-top:16px; display:flex; gap:12px; align-items:center;">
                    <button type="submit" class="btn btn-primary" th:text="#{form.button.create}">Create Tour</button>
                    <a th:href="@{/tours}" class="btn btn-outline-secondary" th:text="#{form.button.cancel}" style="text-decoration:none; padding:8px 12px; border-radius:8px;">Cancel</a>
                </div>

            </form>
        </div> <!-- /.card -->

    </div>

    <!-- Non-manager message -->
    <div sec:authorize="!hasRole('MANAGER')">
        <p class="no-access" th:text="#{access.denied}">You do not have permission to access this page.</p>
    </div>

</div>

</body>
</html>
