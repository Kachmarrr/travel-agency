<!-- src/main/resources/templates/tours/list.html -->
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Tours</title>
</head>
<body>
<section layout:fragment="body">
    <h1>Available Tours</h1>

    <div th:if="${#lists.isEmpty(tours)}">
        <p>No tours available.</p>
    </div>

    <div th:unless="${#lists.isEmpty(tours)}" class="row">
        <div th:each="tour : ${tours}" class="col-md-4 mb-3">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${tour.title}">Tour title</h5>
                    <p class="card-text" th:text="${tour.description}">Tour description</p>
                    <a th:href="@{'/tours/' + ${tour.id}}" class="btn btn-primary">Details</a>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
