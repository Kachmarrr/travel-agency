<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Edit Tour</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Редагувати тур</h1>

    <form th:action="@{|/tours/update/${tour.id}|}" th:object="${tour}" method="post"
          onsubmit="return confirm('Зберегти зміни у турі?');" sec:authorize="hasAnyRole('MANAGER','ADMIN')">

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">Будь ласка, виправте помилки у формі.</div>

        <div class="form-row">
            <label for="title">Title</label>
            <input id="title" type="text" th:field="*{title}" />
            <div class="field-error" th:errors="*{title}"></div>
        </div>

        <div class="form-row">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="4"></textarea>
            <div class="field-error" th:errors="*{description}"></div>
        </div>

        <div class="form-row">
            <label for="price">Price (₴)</label>
            <input id="price" type="number" step="0.01" min="0" th:field="*{price}" />
            <div class="field-error" th:errors="*{price}"></div>
        </div>

        <!-- ===== ENUM: TourType ===== -->
        <div class="form-row">
            <label for="tourType">Tour Type</label>
            <select id="tourType" th:field="*{tourType}">
                <option th:each="tt : ${T(com.epam.finaltask.model.enums.TourType).values()}"
                        th:value="${tt.name()}" th:text="${tt.name()}">TYPE</option>
            </select>
            <div class="field-error" th:errors="*{tourType}"></div>
        </div>

        <!-- ===== ENUM: TransferType ===== -->
        <div class="form-row">
            <label for="transferType">Transfer Type</label>
            <select id="transferType" th:field="*{transferType}">
                <option th:each="tr : ${T(com.epam.finaltask.model.enums.TransferType).values()}"
                        th:value="${tr.name()}" th:text="${tr.name()}">TRANSFER</option>
            </select>
            <div class="field-error" th:errors="*{transferType}"></div>
        </div>

        <!-- ===== ENUM: HotelType ===== -->
        <div class="form-row">
            <label for="hotelType">Hotel Type</label>
            <select id="hotelType" th:field="*{hotelType}">
                <option th:each="ht : ${T(com.epam.finaltask.model.enums.HotelType).values()}"
                        th:value="${ht.name()}" th:text="${ht.name()}">HOTEL</option>
            </select>
            <div class="field-error" th:errors="*{hotelType}"></div>
        </div>

        <!-- STATUS (якщо хочеш) -->
        <div class="form-row">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}">
                <option th:each="s : ${T(com.epam.finaltask.model.enums.TourStatus).values()}"
                        th:value="${s.name()}" th:text="${s.name()}">STATUS</option>
            </select>
        </div>

        <div class="form-row">
            <label for="arrivalDate">Arrival Date</label>
            <input id="arrivalDate" type="date" th:field="*{arrivalDate}" />
        </div>

        <div class="form-row">
            <label for="evictionDate">Eviction Date</label>
            <input id="evictionDate" type="date" th:field="*{evictionDate}" />
        </div>

        <div class="form-row">
            <label>
                <input type="checkbox" th:field="*{isHot}" /> Hot
            </label>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/tours}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
