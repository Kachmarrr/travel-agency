<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title}">Travel Agency</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>

<nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
        <div class="navbar-left">
            <a class="navbar-brand" th:href="@{/}" th:text="#{app.name}">Travel Agency</a>
        </div>
        <div class="navbar-right">
            <div class="lang-switcher">
                <span th:text="#{lang.label}">Language:</span>
                <a th:href="@{/dashboard(lang='en')}" th:text="#{lang.en}">English</a>
                <span>|</span>
                <a th:href="@{/dashboard(lang='uk')}" th:text="#{lang.uk}">Українська</a>
            </div>

            <span th:with="balLabel=#{balance.label}" class="balance"
                  th:text="${user != null ? balLabel + ' ' + user.balance + ' ₴' : ''}">0 ₴</span>

            <a th:href="@{/profile}" class="btn btn-profile" th:text="#{nav.profile}">Profile</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/users}" class="btn btn-edit" th:text="#{nav.adminUsers}">Users</a>

            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-logout" th:text="#{nav.logout}">Log out</button>
            </form>

            <a sec:authorize="hasAnyRole('MANAGER','ADMIN')" th:href="@{|/tours/create|}" class="btn btn-edit"
               th:text="#{nav.createTour}">Create new tour</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 th:text="#{page.heading}">Available Tours</h1>

    <!-- Sort panel -->
    <details class="sort-panel">
        <summary class="sort-summary">Sort & View ▾</summary>

        <div class="sort-content">
            <form th:action="@{/dashboard}" method="get" class="sort-form">
                <input type="hidden" name="tourType" th:value="${tourType}"/>
                <input type="hidden" name="hotelType" th:value="${hotelType}"/>
                <input type="hidden" name="transferType" th:value="${transferType}"/>

                <div class="sort-row">
                    <label th:text="#{filters.sortBy}">Sort by</label>
                    <select name="sortField">
                        <option value="price" th:selected="${sortField == 'price'}" th:text="#{filters.price}">Price</option>
                        <option value="arrivalDate" th:selected="${sortField == 'arrivalDate'}" th:text="#{filters.arrivalDate}">Arrival Date</option>
                        <option value="title" th:selected="${sortField == 'title'}" th:text="#{filters.title}">Title</option>
                    </select>

                    <label th:text="#{filters.direction}">Direction</label>
                    <select name="sortDir">
                        <option value="asc" th:selected="${sortDir == 'asc'}" th:text="#{filters.asc}">Ascending</option>
                        <option value="desc" th:selected="${sortDir == 'desc'}" th:text="#{filters.desc}">Descending</option>
                    </select>

                    <button type="submit" class="btn btn-primary" th:text="#{filters.apply}">Apply</button>
                    <a th:href="@{/dashboard}" class="btn btn-outline-secondary" th:text="#{filters.reset}">Reset</a>
                </div>
            </form>
        </div>
    </details>

    <div th:if="${#lists.isEmpty(tours)}" class="alert" th:text="#{tours.empty}">Currently there are no tours. Check back later.</div>

    <!-- Tours grid -->
    <div class="tours-grid" th:if="${tours != null and !#lists.isEmpty(tours.content)}">
        <div class="tour-card" th:each="tour : ${tours.content}">
            <div class="tour-image">
                <span th:text="#{tour.noImage}">No image</span>
            </div>

            <div class="tour-body">
                <h5 th:text="${tour.title}">Tour title</h5>
                <p th:text="${tour.description}">Short description</p>

                <div class="tour-footer">
                    <span th:text="${tour.price != null ? tour.price + ' ₴' : '—'}">—</span>
                    <div class="tour-buttons">
                        <a th:href="@{|/tours/${tour.id}|}" class="btn btn-outline-primary" th:text="#{btn.details}">Details</a>
                        <form th:action="@{|/tours/delete/${tour.id}|}" method="post" sec:authorize="hasAnyRole('MANAGER','ADMIN')"
                              th:attr="onsubmit=|return confirm('#{confirm.delete}')|">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-delete" th:text="#{btn.delete}">Delete</button>
                        </form>
                        <a sec:authorize="hasAnyRole('MANAGER','ADMIN')" th:href="@{|/tours/edit/${tour.id}|}" class="btn btn-edit" th:text="#{btn.edit}">Edit</a>
                    </div>
                </div>
            </div>

            <div class="tour-id">
                <span th:text="${tour.id}">#id</span>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${tours != null and tours.totalPages > 1}">
        <ul class="pagination">
            <li th:classappend="${tours.first} ? 'disabled'">
                <a th:if="${!tours.first}"
                   th:href="@{/dashboard(page=${tours.number-1}, size=${tours.size}, tourType=${tourType}, hotelType=${hotelType}, transferType=${transferType}, sortField=${sortField}, sortDir=${sortDir})}">←</a>
                <span th:if="${tours.first}">←</span>
            </li>

            <li th:each="i : ${#numbers.sequence(0, tours.totalPages-1)}" th:classappend="${i == tours.number} ? 'active'">
                <a th:href="@{/dashboard(page=${i}, size=${tours.size}, tourType=${tourType}, hotelType=${hotelType}, transferType=${transferType}, sortField=${sortField}, sortDir=${sortDir})}" th:text="${i+1}">1</a>
            </li>

            <li th:classappend="${tours.last} ? 'disabled'">
                <a th:if="${!tours.last}"
                   th:href="@{/dashboard(page=${tours.number+1}, size=${tours.size}, tourType=${tourType}, hotelType=${hotelType}, transferType=${transferType}, sortField=${sortField}, sortDir=${sortDir})}">→</a>
                <span th:if="${tours.last}">→</span>
            </li>
        </ul>
    </nav>

</div>

</body>
</html>
