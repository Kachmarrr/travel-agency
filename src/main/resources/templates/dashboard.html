<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Навігаційна панель -->
<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a class="navbar-brand" th:href="@{/}">Travel Agency</a>
        </div>
        <div class="navbar-right">
            <span class="balance" th:text="${user != null ? 'Balance: ' + user.balance + ' ₴' : ''}">0 ₴</span>
            <a th:href="@{/profile}" class="btn btn-profile">Profile</a>

            <!-- Spring security have default path for log out -->
            <form th:action="@{/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-logout">Log out</button>
            </form>

            <a sec:authorize="hasAnyRole('MANAGER','ADMIN')"
               th:href="@{|/tours/create|}"
               class="btn btn-edit">Create new tour</a>
        </div>
    </div>
</nav>

<!-- Контейнер з турами -->
<div class="container">
    <h1>Available Tours</h1>

    <div th:if="${#lists.isEmpty(tours)}" class="alert">
        Currently there are no tours. Check back later.
    </div>

    <div class="tours-grid" th:if="${!#lists.isEmpty(tours)}">
        <div class="tour-card" th:each="tour : ${tours}">
            <div class="tour-image">
                <span>No image</span>
            </div>

            <div class="tour-body">
                <h5 class="tour-title" th:text="${tour.title}">Tour title</h5>
                <p class="tour-description" th:text="${tour.description}">Short description</p>

                <div class="tour-footer">
                    <span class="tour-price" th:text="${tour.price != null ? tour.price + ' ₴' : '—'}">—</span>
                    <div class="tour-buttons">
                        <a th:href="@{|/tours/${tour.id}|}" class="btn btn-details">Details</a>

                        <!-- Заміна небезпечного GET-посилання на безпечну POST-форму для видалення -->
                        <form th:action="@{|/tours/delete/${tour.id}|}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this tour?');"
                              sec:authorize="hasAnyRole('MANAGER','ADMIN')">
                            <!-- CSRF token (Spring Security додає _csrf у модель) -->
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-delete">Delete</button>
                        </form>

                        <a sec:authorize="hasAnyRole('MANAGER','ADMIN')"
                           th:href="@{|/tours/edit/${tour.id}|}"
                           class="btn btn-edit">Edit</a>
                    </div>
                </div>
            </div>

            <div class="tour-id">
                <span th:text="${tour.id}">#id</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
