<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <a class="navbar-brand" th:href="@{/}">Travel Agency</a>
        </div>

        <!-- Mobile toggle -->
        <button id="navToggleHome" class="btn" aria-label="Toggle navigation" style="display:none;">☰</button>

        <div class="navbar-right" id="navbarRightHome">
            <span class="balance" th:text="${user != null ? 'Баланс: ' + user.balance + ' ₴' : ''}"></span>

            <a sec:authorize="isAuthenticated()" th:href="@{/profile}" class="btn btn-profile">Profile</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/auth/logout}" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-logout">Log out</button>
            </form>

            <a sec:authorize="!isAuthenticated()" th:href="@{/auth/login}" class="btn btn-profile">Sign in</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/auth/register}" class="btn btn-logout">Sign up</a>

            <a sec:authorize="hasAnyRole('MANAGER','ADMIN')" th:href="@{|/tours/create|}" class="btn btn-edit">Create new tour</a>
        </div>
    </div>
</nav>

<div class="container">
    <h1 class="h3 mb-3">Available Tours</h1>

    <div th:if="${#lists.isEmpty(tours)}" class="alert alert-info">
        Currently there are no tours. Check back later.
    </div>

    <div class="tours-grid" th:if="${!#lists.isEmpty(tours)}">
        <div class="tour-card" th:each="tour : ${tours}">
            <div class="tour-image">
                <span class="text-muted">No image</span>
            </div>

            <div class="tour-body">
                <h5 class="tour-title" th:text="${tour.title}">Tour title</h5>
                <p class="tour-description" th:text="${tour.description}">Short description</p>

                <div class="tour-footer">
                    <span class="tour-price" th:text="${tour.price != null ? tour.price + ' ₴' : '—'}">—</span>

                    <div class="tour-buttons">
                        <a th:href="@{|/tours/${tour.id}|}" class="btn btn-outline-primary">Details</a>

                        <a sec:authorize="hasAnyRole('MANAGER','ADMIN')" th:href="@{|/tours/edit/${tour.id}|}" class="btn btn-edit">Edit</a>

                        <form th:action="@{|/tours/delete/${tour.id}|}" method="post"
                              onsubmit="return confirm('Are you sure you want to delete this tour?');"
                              sec:authorize="hasAnyRole('MANAGER','ADMIN')" style="display:inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="btn btn-delete">Delete</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="tour-id">
                <span th:text="${tour.id}">#id</span>
            </div>
        </div>
    </div>
</div>

<script>
    // Minimal mobile toggle for home navbar
    (function () {
        const navToggle = document.getElementById('navToggleHome');
        const navbarRight = document.getElementById('navbarRightHome');

        function updateToggleVisibility() {
            if (window.innerWidth <= 600) {
                navToggle.style.display = 'inline-block';
                navbarRight.style.display = 'none';
            } else {
                navToggle.style.display = 'none';
                navbarRight.style.display = 'flex';
            }
        }

        navToggle.addEventListener('click', () => {
            if (navbarRight.style.display === 'none' || navbarRight.style.display === '') {
                navbarRight.style.display = 'flex';
                navbarRight.style.flexDirection = 'column';
                navbarRight.style.gap = '0.5rem';
            } else {
                navbarRight.style.display = 'none';
            }
        });

        window.addEventListener('resize', updateToggleVisibility);
        updateToggleVisibility();
    })();
</script>

</body>
</html>
