<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{page.title}">Travel Agency</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
</head>
<body>

<!-- Навігаційна панель -->
<nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="navbar-container">
        <div class="navbar-left">
            <a class="navbar-brand" th:href="@{/}" th:text="#{app.name}">Travel Agency</a>
        </div>
        <div class="navbar-right" style="display:flex; gap:12px; align-items:center;">
            <!-- Language switcher -->
            <div class="lang-switcher" style="display:inline-flex; gap:8px; align-items:center;">
                <span th:text="#{lang.label}">Language:</span>
                <a th:href="@{/(lang='en')}" th:text="#{lang.en}" rel="alternate" hreflang="en">English</a>
                <span>|</span>
                <a th:href="@{/(lang='uk')}" th:text="#{lang.uk}" rel="alternate" hreflang="uk">Українська</a>
            </div>

            <a sec:authorize="!isAuthenticated()" th:href="@{/auth/login}" class="btn btn-profile">Sign in</a>
            <a sec:authorize="!isAuthenticated()" th:href="@{/auth/register}" class="btn btn-logout">Sign up</a>
        </div>
    </div>
</nav>

<!-- Контейнер з турами -->
<div class="container" style="max-width:1100px; margin:24px auto; padding:0 16px;">
    <h1 th:text="#{page.heading}">Available Tours</h1>

    <div th:if="${#lists.isEmpty(tours)}" class="alert" th:text="#{tours.empty}">
        Currently there are no tours. Check back later.
    </div>

    <div class="tours-grid" th:if="${!#lists.isEmpty(tours)}">
        <div class="tour-card" th:each="tour : ${tours}">
            <div class="tour-image">
                <span th:text="#{tour.noImage}">No image</span>
            </div>

            <div class="tour-body">
                <h5 class="tour-title" th:text="${tour.title}">Tour title</h5>
                <p class="tour-description" th:text="${tour.description}">Short description</p>

                <div class="tour-footer">
                    <span class="tour-price"
                          th:text="${tour.price != null ? tour.price + ' ₴' : '—'}">—</span>
                    <div class="tour-buttons" style="display:flex; gap:8px; align-items:center;">

                        <a th:href="@{|/tours/${tour.id}|}" class="btn btn-details" th:text="#{btn.details}">Details</a>

                        <!-- Безпечна POST-форма для видалення, confirm повідомлення з i18n -->
                        <form th:action="@{|/tours/delete/${tour.id}|}"
                              method="post"
                              sec:authorize="hasAnyRole('MANAGER','ADMIN')"
                              th:attr="onsubmit=|return confirm('#{confirm.delete}')|">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-delete" th:text="#{btn.delete}">Delete</button>
                        </form>

                        <a sec:authorize="hasAnyRole('MANAGER','ADMIN')"
                           th:href="@{|/tours/edit/${tour.id}|}"
                           class="btn btn-edit"
                           th:text="#{btn.edit}">Edit</a>
                    </div>
                </div>
            </div>

            <div class="tour-id">
                <span th:text="${tour.id}">#id</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
