<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Agency</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Travel Agency</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
            </ul>
            <form class="d-flex">
                <a th:href="@{/auth/sign-in}" class="btn btn-outline-success me-2">Sign in</a>
                <a th:href="@{/auth/sign-up}" class="btn btn-sm btn-outline-secondary">Sign up</a>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="h3 mb-3">Available Tours</h1>

    <div th:if="${#lists.isEmpty(tours)}" class="alert alert-info">
        Currently there are no tours. Check back later.
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-4" th:if="${!#lists.isEmpty(tours)}">
        <div class="col" th:each="tour : ${tours}">
            <div class="card h-100 shadow-sm">
                <div style="height:180px; background:#f8f9fa; display:flex; align-items:center; justify-content:center;">
                    <span class="text-muted">No image</span>
                </div>

                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${tour.title}">Tour title</h5>
                    <p class="card-text text-truncate" th:text="${tour.description}">Short description</p>

                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <div>
                            <strong th:text="${tour.price != null ? #numbers.formatDecimal(tour.price, 1, 'POINT', 2, 'NONE') + ' ₴' : '—'}">0.0</strong>
                        </div>
                        <div>
                            <a th:href="@{|/tours/${tour.id}|}" class="btn btn-sm btn-outline-primary me-2">Details</a>
                            <a th:href="@{|/tours/edit/${tour.id}|}" class="btn btn-sm btn-outline-secondary">Edit</a>
                        </div>
                    </div>
                </div>

                <div class="card-footer text-muted small">
                    <span th:text="${tour.id}">#id</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
