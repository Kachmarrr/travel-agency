<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="#{error.not.found.title}">Error 404 — Not found</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            color: #721c24;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .error-container {
            background-color: #f5c6cb;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            color: #721c24;
            font-weight: bold;
            border: 2px solid #721c24;
            padding: 8px 16px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        a:hover {
            background-color: #721c24;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="error-container">
    <h1>404</h1>
    <p th:text="#{error.not.found.message}">Page not found</p>
    <a th:href="@{/dashboard}" th:text="#{error.not.found.back}">Back to dashboard</a>
</div>
</body>
</html>
